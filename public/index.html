<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RPL - Rohidas Premier League</title><meta name="theme-color" content="#f59e0b">
<meta name="description" content="Register your team for Rohidas Premier League (RPL) box cricket.">
<link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css"></head>
<body>
<header><a class="brand" href="/"><img src="/logo-128.png" alt="RPL logo" width="42" height="42"><h1>RPL<small>Rohidas Premier League · Box Cricket</small></h1></a></header>
<div class="wrap">
  <a class="regcta" id="regCta" href="/register">
    <span class="t">🏏 Register Your Team</span>
    <span class="s" id="regCtaSub">Rohidas Premier League</span>
    <span class="go" id="regCtaGo">Register now →</span>
  </a>
  <div id="v-teams"></div>
  <div class="foot"><a href="/admin" id="adminLink" class="adminlink">🔒 Admin Login</a>
  <div class="credit">Developed by Aditya Solanki (Dipesh)</div></div>
</div>
<script src="/reg-common.js"></script><script src="/teams-view.js"></script>
<script>
const $ = id => document.getElementById(id);
fetch('/api/reg/config').then(r => r.json()).then(c => {
  if (c.open) {
    $('regCtaSub').textContent = c.season + ' · ' + c.year + (c.fee ? ' · Entry fee ₹' + Number(c.fee).toLocaleString('en-IN') : '');
  } else {
    $('regCta').classList.add('closed'); $('regCta').href = '#teams';
    $('regCta').querySelector('.t').textContent = '🏏 ' + c.season + ' registration closed';
    $('regCtaSub').textContent = 'See all registered teams below';
    $('regCtaGo').textContent = 'View teams →';
    $('regCta').onclick = (e) => { e.preventDefault(); $('v-teams').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  }
}).catch(() => {});
TeamsView($('v-teams'));
</script>
</body></html>
